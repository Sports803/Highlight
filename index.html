<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sports 803 – Today's Events</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --red: #e02828;
  --red-dim: rgba(224,40,40,.12);
  --red-border: rgba(224,40,40,.25);
  --bg: #0c0c0c;
  --card: #111111;
  --card2: #141414;
  --border: #1f1f1f;
  --text: #f0f0f0;
  --muted: #555;
  --blue: #3b82f6;
  --blue-dim: rgba(59,130,246,.15);
  --blue-border: rgba(59,130,246,.3);
  --green: #22c55e;
  --amber: #f59e0b;
  --amber-dim: rgba(245,158,11,.12);
  --amber-border: rgba(245,158,11,.3);
  --purple: #a855f7;
  --purple-dim: rgba(168,85,247,.12);
  --purple-border: rgba(168,85,247,.3);
  --orange: #f97316;
  --orange-dim: rgba(249,115,22,.12);
  --orange-border: rgba(249,115,22,.3);
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  min-height: 100vh;
}

/* ── TOP NAV ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #0a0a0a;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px;
  font-weight: 900;
  color: var(--red);
  letter-spacing: 1px;
}
.topbar-logo span { color: var(--text); }
.admin-lock-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-family: 'Barlow', sans-serif;
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.admin-lock-btn:hover { border-color: var(--red); color: var(--red); }
.admin-lock-btn.active { border-color: var(--green); color: var(--green); background: rgba(34,197,94,.08); }

/* ── WIDGET WRAPPER ── */
.s803-matches-only {
  font-family: 'Barlow', sans-serif;
  width: 100%;
  max-width: 640px;
  box-sizing: border-box;
  margin: 0 auto;
  padding: 0 0 20px;
}

/* ── SECTION HEADER ── */
.s803-matches-only .sh {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 12px 10px;
}
.s803-matches-only .sh-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 800;
  color: #f5f5f5;
  display: flex;
  align-items: center;
  gap: 6px;
  letter-spacing: .5px;
}
.s803-matches-only .sh-more {
  font-size: 11px;
  font-weight: 700;
  color: var(--red);
  text-decoration: none;
  letter-spacing: .3px;
}

/* ── SPORT TYPE ACCENT COLORS ── */
.match-card { --card-accent: var(--red); --card-accent-dim: var(--red-dim); --card-accent-border: var(--red-border); }
.match-card[data-sport="motorsport"] { --card-accent: var(--orange); --card-accent-dim: var(--orange-dim); --card-accent-border: var(--orange-border); }
.match-card[data-sport="mma"] { --card-accent: var(--purple); --card-accent-dim: var(--purple-dim); --card-accent-border: var(--purple-border); }
.match-card[data-sport="basketball"] { --card-accent: var(--amber); --card-accent-dim: var(--amber-dim); --card-accent-border: var(--amber-border); }
.match-card[data-sport="american-football"] { --card-accent: var(--green); --card-accent-dim: rgba(34,197,94,.12); --card-accent-border: rgba(34,197,94,.3); }

/* ── MATCH CARD ── */
.s803-matches-only .match-card {
  background: linear-gradient(135deg,var(--card2),var(--card));
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  margin: 0 10px 10px;
  transition: border-color .2s;
  position: relative;
}
.s803-matches-only .match-card.is-live {
  border-color: var(--card-accent-border);
  box-shadow: 0 0 12px rgba(224,40,40,.1);
}
.s803-matches-only .match-card.is-live::before {
  content: '';
  display: block;
  height: 2px;
  background: var(--card-accent);
}
.s803-matches-only .match-card > a {
  display: block;
  text-decoration: none;
  color: #fff;
}

/* ── TWO-TEAM LAYOUT ── */
.s803-matches-only .match-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  gap: 10px;
}
.s803-matches-only .team {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 72px;
}
.s803-matches-only .tlogo {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: rgba(255,255,255,.04);
  object-fit: contain;
  padding: 2px;
}
.s803-matches-only .tlogo-fb {
  display: none;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--red);
  align-items: center;
  justify-content: center;
  font-size: 16px;
}
.s803-matches-only .tname {
  font-size: 9px;
  font-weight: 700;
  color: #ccc;
  text-align: center;
  line-height: 1.3;
  max-width: 68px;
  letter-spacing: .2px;
}
.s803-matches-only .mc {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-width: 0;
}
.s803-matches-only .score {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 24px;
  font-weight: 900;
  color: #fff;
  letter-spacing: 4px;
}

/* ── SOLO EVENT LAYOUT ── */
.s803-matches-only .event-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
}
.s803-matches-only .event-icon {
  width: 48px; height: 48px;
  border-radius: 10px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.08);
  object-fit: contain;
  padding: 4px;
  flex-shrink: 0;
}
.s803-matches-only .event-icon-fb {
  width: 48px; height: 48px;
  border-radius: 10px;
  background: var(--card-accent, var(--red));
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}
.s803-matches-only .event-info {
  flex: 1;
  min-width: 0;
}
.s803-matches-only .event-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  font-weight: 800;
  color: #fff;
  line-height: 1.2;
  letter-spacing: .3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.s803-matches-only .event-subtitle {
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  margin-top: 2px;
}
.s803-matches-only .event-badges {
  display: flex;
  gap: 4px;
  margin-top: 5px;
  flex-wrap: wrap;
}

/* ── BADGES ── */
.s803-matches-only .badge {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 5px;
  letter-spacing: .5px;
}
.s803-matches-only .badge.live { background: var(--card-accent, var(--red)); color: #fff; animation: s803p 1.5s infinite; }
.s803-matches-only .badge.upcoming { background: var(--blue-dim); border: 1px solid var(--blue-border); color: var(--blue); }
.s803-matches-only .badge.ended { background: rgba(255,255,255,.06); color: var(--muted); }
.s803-matches-only .cd { font-size: 9px; font-weight: 700; color: var(--blue); }
.s803-matches-only .match-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 5px 14px 6px;
  border-top: 1px solid rgba(255,255,255,.05);
  flex-wrap: wrap;
}
.s803-matches-only .meta-left { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.s803-matches-only .meta-tag {
  font-size: 8px;
  font-weight: 700;
  background: #1a1a1a;
  color: var(--muted);
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: .3px;
}
.s803-matches-only .meta-tag.league-tag {
  color: var(--card-accent, var(--red));
  background: var(--card-accent-dim, var(--red-dim));
  border: 1px solid var(--card-accent-border, var(--red-border));
}
@keyframes s803p { 0%,100%{opacity:1} 50%{opacity:.6} }

/* ── ADMIN DELETE OVERLAY ── */
.match-card.admin-mode .admin-card-overlay { display: flex; }
.admin-card-overlay {
  display: none;
  position: absolute;
  top: 6px; right: 6px;
  gap: 5px;
  z-index: 20;
}
.admin-delete-btn {
  background: rgba(224,40,40,.9);
  border: none;
  border-radius: 5px;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 4px 8px;
  cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: .5px;
  backdrop-filter: blur(4px);
}
.admin-delete-btn:hover { background: #e02828; }

/* ── ADMIN PANEL ── */
#admin-panel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(0,0,0,.85);
  backdrop-filter: blur(6px);
  overflow-y: auto;
  padding: 20px 12px 40px;
}
#admin-panel.open { display: flex; align-items: flex-start; justify-content: center; }

.ap-box {
  background: #111;
  border: 1px solid #2a2a2a;
  border-radius: 14px;
  width: 100%;
  max-width: 580px;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,.8);
  animation: ap-in .25s ease;
}
@keyframes ap-in { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

.ap-header {
  background: linear-gradient(135deg,#1a0808,#111);
  border-bottom: 1px solid var(--red-border);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ap-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 900;
  color: var(--red);
  letter-spacing: 1px;
}
.ap-close-btn {
  background: none; border: none;
  color: var(--muted); font-size: 18px;
  cursor: pointer; line-height: 1;
  transition: color .15s;
}
.ap-close-btn:hover { color: #fff; }

.ap-body { padding: 20px; }
.ap-section-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 800;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 12px;
}

/* ── SPORT TYPE SELECTOR ── */
.sport-type-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 14px;
}
.sport-type-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: #0d0d0d;
  border: 1px solid #252525;
  border-radius: 8px;
  color: var(--muted);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .3px;
  padding: 8px 4px;
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
}
.sport-type-btn .sport-icon { font-size: 18px; }
.sport-type-btn.active { border-color: var(--red); color: var(--red); background: var(--red-dim); }
.sport-type-btn:not(.active):hover { border-color: #333; color: #aaa; }

/* ── INPUT MODE TABS ── */
.ap-mode-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  background: #0d0d0d;
  border: 1px solid #252525;
  border-radius: 8px;
  padding: 4px;
}
.ap-mode-tab {
  flex: 1;
  background: none;
  border: none;
  border-radius: 6px;
  color: var(--muted);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .5px;
  padding: 7px 10px;
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
}
.ap-mode-tab.active { background: var(--red); color: #fff; }
.ap-mode-tab:not(.active):hover { color: #bbb; background: rgba(255,255,255,.05); }

.ap-tab-panel { display: none; }
.ap-tab-panel.active { display: block; }

/* ── LOGO SEARCH ── */
.logo-search-row {
  display: flex;
  gap: 6px;
  margin-bottom: 6px;
  align-items: flex-end;
}
.logo-search-input-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.logo-search-btn {
  background: linear-gradient(135deg, var(--blue), #1d4ed8);
  border: none;
  border-radius: 7px;
  color: #fff;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .4px;
  padding: 8px 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity .15s;
  align-self: flex-end;
}
.logo-search-btn:hover { opacity: .85; }

.logo-results {
  display: none;
  gap: 6px;
  flex-wrap: wrap;
  padding: 8px;
  background: #0a0a0a;
  border: 1px solid #252525;
  border-radius: 7px;
  margin-bottom: 8px;
  animation: ap-in .2s ease;
}
.logo-results.visible { display: flex; }
.logo-result-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  padding: 5px 7px;
  border-radius: 6px;
  border: 1px solid transparent;
  transition: all .15s;
}
.logo-result-item:hover { background: rgba(255,255,255,.05); border-color: var(--red); }
.logo-result-item img { width: 32px; height: 32px; object-fit: contain; border-radius: 50%; background: rgba(255,255,255,.04); }
.logo-result-item span { font-size: 8px; color: var(--muted); font-weight: 700; text-align: center; max-width: 48px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.logo-result-item.loading-state { color: var(--muted); font-size: 10px; padding: 8px 12px; font-style: italic; }

/* Form grid */
.ap-form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}
.ap-field { display: flex; flex-direction: column; gap: 4px; }
.ap-field.full { grid-column: 1/-1; }
.ap-label { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; }
.ap-input, .ap-select {
  background: #0d0d0d;
  border: 1px solid #252525;
  border-radius: 7px;
  color: #eee;
  font-size: 12px;
  font-family: 'Barlow', sans-serif;
  padding: 8px 10px;
  outline: none;
  transition: border-color .15s;
  width: 100%;
}
.ap-input:focus, .ap-select:focus { border-color: var(--red); }
.ap-select option { background: #111; }

/* Logo preview pill */
.logo-preview-pill {
  display: none;
  align-items: center;
  gap: 6px;
  background: #0a0a0a;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 4px 8px;
  margin-top: 4px;
}
.logo-preview-pill.visible { display: flex; }
.logo-preview-pill img { width: 20px; height: 20px; border-radius: 50%; object-fit: contain; }
.logo-preview-pill span { font-size: 10px; color: #aaa; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.logo-preview-pill button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; line-height: 1; }
.logo-preview-pill button:hover { color: #fff; }

.ap-add-btn {
  width: 100%;
  background: linear-gradient(135deg,#e02828,#a00);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 1px;
  padding: 10px;
  cursor: pointer;
  margin-top: 4px;
  transition: opacity .15s;
}
.ap-add-btn:hover { opacity: .9; }
.ap-add-btn:active { opacity: .7; }

.ap-divider { border: none; border-top: 1px solid #1e1e1e; margin: 20px 0; }

/* Match list in admin */
.ap-match-list { display: flex; flex-direction: column; gap: 6px; }
.ap-match-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #0d0d0d;
  border: 1px solid #1e1e1e;
  border-radius: 8px;
  padding: 8px 12px;
  gap: 8px;
}
.ap-match-info { flex: 1; min-width: 0; }
.ap-match-name { font-size: 12px; font-weight: 700; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ap-match-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }
.ap-remove-btn {
  background: rgba(224,40,40,.15);
  border: 1px solid var(--red-border);
  color: var(--red);
  border-radius: 5px;
  font-size: 10px;
  font-weight: 800;
  padding: 4px 8px;
  cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif;
  flex-shrink: 0;
  transition: background .15s;
}
.ap-remove-btn:hover { background: rgba(224,40,40,.3); }
.ap-empty { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }

/* ── HTML PASTE PANEL ── */
.ap-html-area {
  width: 100%;
  background: #0a0a0a;
  border: 1px solid #252525;
  border-radius: 8px;
  color: #a8d5a2;
  font-size: 11px;
  font-family: 'Courier New', Courier, monospace;
  line-height: 1.55;
  padding: 10px 12px;
  outline: none;
  resize: vertical;
  min-height: 140px;
  transition: border-color .15s;
}
.ap-html-area:focus { border-color: var(--amber); }
.ap-html-area::placeholder { color: #2e2e2e; }
.ap-html-hint { font-size: 10px; color: var(--muted); margin: 6px 0 10px; line-height: 1.5; }
.ap-html-hint strong { color: #888; }
.ap-html-actions { display: flex; gap: 8px; }
.ap-parse-btn {
  flex: 1;
  background: linear-gradient(135deg, var(--amber), #b45309);
  border: none; border-radius: 8px; color: #000;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px; font-weight: 900; letter-spacing: 1px;
  padding: 10px; cursor: pointer; transition: opacity .15s;
}
.ap-parse-btn:hover { opacity: .9; }
.ap-clear-btn {
  background: rgba(255,255,255,.05); border: 1px solid #252525; border-radius: 8px;
  color: var(--muted); font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 800; letter-spacing: .5px;
  padding: 10px 14px; cursor: pointer; transition: all .15s;
}
.ap-clear-btn:hover { border-color: #444; color: #aaa; }
.ap-parse-preview {
  display: none;
  background: #0d0d0d; border: 1px solid var(--amber-border);
  border-radius: 8px; padding: 12px 14px; margin-top: 12px; animation: ap-in .2s ease;
}
.ap-parse-preview.visible { display: block; }
.ap-parse-preview-title {
  font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
  font-weight: 800; color: var(--amber); letter-spacing: .8px;
  text-transform: uppercase; margin-bottom: 10px;
}
.ap-parse-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: flex-start; }
.ap-parse-key { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; width: 70px; flex-shrink: 0; padding-top: 1px; }
.ap-parse-val { font-size: 11px; color: #ddd; word-break: break-all; flex: 1; }
.ap-parse-val.ok { color: #a8d5a2; }
.ap-parse-val.warn { color: var(--amber); }
.ap-parse-val.miss { color: #666; font-style: italic; }
.ap-parse-logos { display: flex; gap: 8px; align-items: center; }
.ap-parse-logos img { width: 24px; height: 24px; border-radius: 50%; background: #1a1a1a; object-fit: contain; }
.ap-confirm-btn {
  width: 100%; background: linear-gradient(135deg,#e02828,#a00);
  border: none; border-radius: 8px; color: #fff;
  font-family: 'Barlow Condensed', sans-serif; font-size: 14px;
  font-weight: 900; letter-spacing: 1px; padding: 10px;
  cursor: pointer; margin-top: 12px; transition: opacity .15s;
}
.ap-confirm-btn:hover { opacity: .9; }

/* ── LOGIN MODAL ── */
#login-modal {
  display: none;
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,.9); backdrop-filter: blur(8px);
  align-items: center; justify-content: center;
}
#login-modal.open { display: flex; }
.lm-box {
  background: #111; border: 1px solid #2a2a2a; border-radius: 14px;
  padding: 32px 28px; width: 100%; max-width: 320px;

<script>
(function(){
'use strict';

const ADMIN_PIN = '8033';
const STORAGE_KEY = 's803_matches_v1';

let adminUnlocked = false;
let _parsedMatch = null;
let _currentSport = 'soccer';
let _logoDebounceTimers = {};

// ── SPORT CONFIG ──
const SPORT_CONFIG = {
  soccer:             { layout:'twoteam', icon:'⚽', fbEmoji:'⚽', labelLeague:'League',    labelHome:'Home Team', labelAway:'Away Team' },
  basketball:         { layout:'twoteam', icon:'🏀', fbEmoji:'🏀', labelLeague:'League',    labelHome:'Home Team', labelAway:'Away Team' },
  'american-football':{ layout:'twoteam', icon:'🏈', fbEmoji:'🏈', labelLeague:'League',    labelHome:'Home Team', labelAway:'Away Team' },
  rugby:              { layout:'twoteam', icon:'🏉', fbEmoji:'🏉', labelLeague:'League',    labelHome:'Home Team', labelAway:'Away Team' },
  tennis:             { layout:'twoteam', icon:'🎾', fbEmoji:'🎾', labelLeague:'Tournament', labelHome:'Player 1',  labelAway:'Player 2' },
  mma:                { layout:'twoteam', icon:'🥊', fbEmoji:'🥊', labelLeague:'Event',     labelHome:'Fighter 1', labelAway:'Fighter 2' },
  motorsport:         { layout:'solo',    icon:'🏎️', fbEmoji:'🏎️', labelLeague:'Series',    labelHome:'',          labelAway:'' },
  other:              { layout:'twoteam', icon:'🏅', fbEmoji:'🏅', labelLeague:'League',    labelHome:'Team 1',    labelAway:'Team 2' },
};

// ── LOGO FETCH ──
async function fetchLogoOptions(teamName, sport) {
  const results = [];
  try {
    const url = `https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=${encodeURIComponent(teamName)}`;
    const r = await fetch(url);
    const data = await r.json();
    if (data.teams) {
      for (const t of data.teams.slice(0,6)) {
        if (t.strBadge) results.push({ src: t.strBadge+'/tiny', label: t.strTeam, source: 'TheSportsDB' });
      }
    }
  } catch(e) {}
  const espnKnown = getESPNKnown(sport);
  const nameLC = teamName.toLowerCase();
  for (const [name, id, spt] of espnKnown) {
    if (name.toLowerCase().includes(nameLC) || nameLC.includes(name.toLowerCase().split(' ')[0])) {
      results.push({ src: `https://a.espncdn.com/i/teamlogos/${spt}/500/${id}.png`, label: name, source: 'ESPN' });
    }
  }
  if (sport === 'motorsport') results.push(...getMotorsportLogos(teamName));
  if (sport === 'mma') results.push(...getMMALogos(teamName));
  return results;
}

function getESPNKnown(sport) {
  const soccer = [
    ['Barcelona',83,'soccer'],['Real Madrid',86,'soccer'],['Atletico Madrid',1068,'soccer'],
    ['Sevilla',243,'soccer'],['Valencia',94,'soccer'],['Villarreal',102,'soccer'],
    ['Athletic Club',93,'soccer'],['Espanyol',88,'soccer'],['Getafe',2922,'soccer'],
    ['PSG',160,'soccer'],['Lens',175,'soccer'],['Strasbourg',180,'soccer'],
    ['Manchester City',382,'soccer'],['Crystal Palace',384,'soccer'],
    ['Arsenal',359,'soccer'],['Chelsea',363,'soccer'],['Liverpool',364,'soccer'],
    ['Manchester United',360,'soccer'],['Tottenham',367,'soccer'],['Newcastle',361,'soccer'],
    ['Bayern Munich',132,'soccer'],['Borussia Dortmund',124,'soccer'],
    ['Inter Milan',110,'soccer'],['AC Milan',103,'soccer'],['Juventus',111,'soccer'],
    ['Roma',113,'soccer'],['Lazio',115,'soccer'],['Napoli',116,'soccer'],
    ['Ajax',169,'soccer'],['Porto',197,'soccer'],['Benfica',192,'soccer'],
    ['Celtic',245,'soccer'],['Rangers',249,'soccer'],
    ['Galatasaray',383,'soccer'],['Fenerbahce',385,'soccer'],
  ];
  const nba = [
    ['Lakers',13,'basketball'],['Warriors',9,'basketball'],['Bulls',4,'basketball'],
    ['Celtics',2,'basketball'],['Heat',14,'basketball'],['Knicks',18,'basketball'],
    ['Nets',17,'basketball'],['76ers',20,'basketball'],['Bucks',15,'basketball'],
    ['Suns',24,'basketball'],['Mavericks',6,'basketball'],['Nuggets',7,'basketball'],
  ];
  const nfl = [
    ['Chiefs',12,'football'],['Eagles',21,'football'],['Cowboys',6,'football'],
    ['Patriots',17,'football'],['49ers',25,'football'],['Rams',14,'football'],
    ['Packers',9,'football'],['Bears',3,'football'],['Steelers',23,'football'],
  ];
  return [...soccer, ...nba, ...nfl];
}

function getMotorsportLogos(query) {
  const q = query.toLowerCase();
  const all = [
    { src:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Formula_One_logo.svg/200px-Formula_One_logo.svg.png', label:'Formula 1', source:'Wikipedia' },
    { src:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/MotoGP_logo.svg/200px-MotoGP_logo.svg.png', label:'MotoGP', source:'Wikipedia' },
    { src:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/NASCAR_logo.svg/200px-NASCAR_logo.svg.png', label:'NASCAR', source:'Wikipedia' },
    { src:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/IndyCar_Series.svg/200px-IndyCar_Series.svg.png', label:'IndyCar', source:'Wikipedia' },
    { src:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Mercedes_AMG_Petronas_F1_Logo.svg/200px-Mercedes_AMG_Petronas_F1_Logo.svg.png', label:'Mercedes F1', source:'Wikipedia' },
    { src:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Red_Bull_Racing_2022.svg/200px-Red_Bull_Racing_2022.svg.png', label:'Red Bull Racing', source:'Wikipedia' },
    { src:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Scuderia_Ferrari_Logo.svg/200px-Scuderia_Ferrari_Logo.svg.png', label:'Ferrari', source:'Wikipedia' },
    { src:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/McLaren_Racing_logo.svg/200px-McLaren_Racing_logo.svg.png', label:'McLaren', source:'Wikipedia' },
    { src:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Repsol_Honda_logo.svg/200px-Repsol_Honda_logo.svg.png', label:'Repsol Honda', source:'Wikipedia' },
    { src:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Ducati_Corse_logo.svg/200px-Ducati_Corse_logo.svg.png', label:'Ducati Corse', source:'Wikipedia' },
  ];
  return all.filter(x => { const lbl = x.label.toLowerCase(); return lbl.includes(q) || q.includes(lbl.split(' ')[0]) || q.length < 3; });
}

function getMMALogos(query) {
  const q = query.toLowerCase();
  const all = [
    { src:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/92/UFC_Logo.svg/200px-UFC_Logo.svg.png', label:'UFC', source:'Wikipedia' },
    { src:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/Bellator_MMA_logo.svg/200px-Bellator_MMA_logo.svg.png', label:'Bellator', source:'Wikipedia' },
    { src:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/ONE_Championship_logo.svg/200px-ONE_Championship_logo.svg.png', label:'ONE Championship', source:'Wikipedia' },
  ];
  return all.filter(x => { const lbl = x.label.toLowerCase(); return lbl.includes(q) || q.includes(lbl.split(' ')[0]) || q.length < 3; });
}

// ── LOGO SEARCH UI ──
window.s803LogoDebounce = function(side) {
  clearTimeout(_logoDebounceTimers[side]);
  _logoDebounceTimers[side] = setTimeout(() => {
    const name = document.getElementById(side === 'home' ? 'ap-home' : 'ap-away').value.trim();
    if (name.length >= 3) s803SearchLogo(side);
  }, 700);
};

window.s803SearchLogo = async function(side) {
  const inputId = side === 'home' ? 'ap-home' : 'ap-away';
  const name = document.getElementById(inputId).value.trim();
  if (!name) { toast('Enter a team name first'); return; }
  const resultsEl = document.getElementById(side + '-logo-results');
  resultsEl.innerHTML = '<div class="logo-result-item loading-state">🔍 Searching…</div>';
  resultsEl.classList.add('visible');
  const options = await fetchLogoOptions(name, _currentSport);
  if (!options.length) { resultsEl.innerHTML = '<div class="logo-result-item loading-state">No logos found — paste a URL manually</div>'; return; }
  const tested = await testImages(options.slice(0, 20));
  if (!tested.length) { resultsEl.innerHTML = '<div class="logo-result-item loading-state">Images not loadable — try a direct URL</div>'; return; }
  resultsEl.innerHTML = '';
  tested.forEach(opt => {
    const item = document.createElement('div');
    item.className = 'logo-result-item';
    item.title = `${opt.label} (${opt.source})`;
    item.innerHTML = `<img src="${esc(opt.src)}" alt="${esc(opt.label)}" loading="lazy"/><span>${esc(opt.label)}</span>`;
    item.onclick = () => s803SelectLogo(side, opt.src, opt.label, resultsEl);
    resultsEl.appendChild(item);
  });
};

async function testImages(options) {
  const results = await Promise.allSettled(
    options.map(opt => new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => { if (img.naturalWidth > 5) res(opt); else rej(); };
      img.onerror = rej;
      img.src = opt.src;
      setTimeout(rej, 4000);
    }))
  );
  return results.filter(r => r.status === 'fulfilled').map(r => r.value);
}

window.s803SelectLogo = function(side, url, label, resultsEl) {
  document.getElementById(side === 'home' ? 'ap-home-logo' : 'ap-away-logo').value = url;
  const pill = document.getElementById(side + '-logo-preview');
  document.getElementById(side + '-logo-preview-img').src = url;
  document.getElementById(side + '-logo-preview-url').textContent = label;
  pill.classList.add('visible');
  resultsEl.classList.remove('visible');
  resultsEl.innerHTML = '';
  toast(`✅ ${label} logo selected`);
};

window.s803ClearLogo = function(side) {
  document.getElementById(side === 'home' ? 'ap-home-logo' : 'ap-away-logo').value = '';
  document.getElementById(side + '-logo-preview').classList.remove('visible');
};

window.s803SearchSeriesLogo = async function() {
  const name = document.getElementById('ap-league').value.trim() || document.getElementById('ap-event-title').value.trim();
  if (!name) { toast('Enter event title or series name first'); return; }
  const resultsEl = document.getElementById('series-logo-results');
  resultsEl.innerHTML = '<div class="logo-result-item loading-state">🔍 Searching…</div>';
  resultsEl.classList.add('visible');
  let options = [];
  if (_currentSport === 'motorsport') options = getMotorsportLogos(name);
  else if (_currentSport === 'mma') options = getMMALogos(name);
  else options = await fetchLogoOptions(name, _currentSport);
  const tested = await testImages(options.slice(0, 15));
  if (!tested.length) { resultsEl.innerHTML = '<div class="logo-result-item loading-state">No logos found — paste URL manually</div>'; return; }
  resultsEl.innerHTML = '';
  tested.forEach(opt => {
    const item = document.createElement('div');
    item.className = 'logo-result-item';
    item.title = opt.label;
    item.innerHTML = `<img src="${esc(opt.src)}" loading="lazy"/><span>${esc(opt.label)}</span>`;
    item.onclick = () => {
      document.getElementById('ap-event-icon').value = opt.src;
      resultsEl.classList.remove('visible');
      toast(`✅ ${opt.label} logo selected`);
    };
    resultsEl.appendChild(item);
  });
};

// ── SPORT TYPE SWITCHING ──
window.s803SetSport = function(sport, btn) {
  _currentSport = sport;
  document.querySelectorAll('.sport-type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const cfg = SPORT_CONFIG[sport] || SPORT_CONFIG.soccer;
  const isSolo = cfg.layout === 'solo';
  document.getElementById('fields-twoteam').style.display = isSolo ? 'none' : 'block';
  document.getElementById('fields-solo').style.display = isSolo ? 'block' : 'none';
  document.getElementById('ap-league-label').textContent = cfg.labelLeague;
  const hints = {
    soccer:'e.g. 🇪🇸 La Liga', basketball:'e.g. 🏀 NBA',
    'american-football':'e.g. 🏈 NFL', rugby:'e.g. 🏉 Premiership',
    tennis:'e.g. 🎾 Roland Garros', mma:'e.g. 🥊 UFC 310',
    motorsport:'e.g. 🏎️ Formula 1', other:'e.g. 🏅 League'
  };
  document.getElementById('ap-league').placeholder = hints[sport] || 'e.g. ⚽ League';
};

// ── TAB SWITCHING ──
window.s803SwitchTab = function(tab) {
  ['form','code'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('panel-'+t).classList.toggle('active', t===tab);
  });
  if (tab !== 'code') {
    document.getElementById('ap-parse-preview').classList.remove('visible');
    _parsedMatch = null;
  }
};

// ── STORAGE ──
function loadMatches() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
  return null;
}
function saveMatches(arr) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch(e) {} }
function getMatches() {
  let m = loadMatches();
  if (!m) { m = DEFAULT_MATCHES; saveMatches(m); }
  return m;
}

// ── RENDER ──
function renderAll() {
  const matches = getMatches();
  const container = document.getElementById('matches-container');
  container.innerHTML = '';
  matches.forEach(m => container.appendChild(buildCard(m)));
  if (adminUnlocked) applyAdminMode(true);
  renderAdminList();
}

function buildCard(m) {
  const div = document.createElement('div');
  div.className = 'match-card';
  div.setAttribute('data-id', m.id);
  div.setAttribute('data-kickoff', m.kickoff);
  div.setAttribute('data-sport', m.sport || 'soccer');
  if (m.post) div.setAttribute('data-post', m.post);

  const cardId = 'kt-' + m.id;
  const link = m.post || '#';
  const isSolo = m.sport === 'motorsport' || (m.eventTitle && !m.home);
  const cfg = SPORT_CONFIG[m.sport] || SPORT_CONFIG.soccer;
  const fbEmoji = cfg.fbEmoji || '⚽';

  let innerHTML = `<div class="admin-card-overlay">
    <button class="admin-delete-btn" onclick="s803DeleteCard('${esc(m.id)}',this)">✕ Remove</button>
  </div>
  <a href="${esc(link)}" target="_blank" rel="noopener noreferrer">`;

  if (isSolo) {
    const icon = m.eventIcon || '';
    innerHTML += `<div class="event-row">
      ${icon
        ? `<img class="event-icon" src="${esc(icon)}" alt="${esc(m.eventTitle||'')}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
           <div class="event-icon-fb">${fbEmoji}</div>`
        : `<div class="event-icon-fb" style="display:flex">${fbEmoji}</div>`
      }
      <div class="event-info">
        <div class="event-title">${esc(m.eventTitle||'Event')}</div>
        <div class="event-subtitle">${esc(m.eventSubtitle||m.league||'')}</div>
        <div class="event-badges">
          <div class="badge upcoming" data-badge="${m.id}">Upcoming</div>
          <div class="cd" data-cd="${m.id}"></div>
        </div>
      </div>
    </div>
    <div class="match-meta">
      <div class="meta-left">
        <div class="meta-tag league-tag">${esc(m.league||cfg.labelLeague)}</div>
        <div class="meta-tag" id="${cardId}">--:--</div>
      </div>
    </div>`;
  } else {
    innerHTML += `<div class="match-row">
      <div class="team">
        ${m.homeLogo
          ? `<img class="tlogo" src="${esc(m.homeLogo)}" alt="${esc(m.home||'')}"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
             <div class="tlogo-fb">${fbEmoji}</div>`
          : `<div class="tlogo-fb" style="display:flex">${fbEmoji}</div>`
        }
        <div class="tname">${esc(m.home||'')}</div>
      </div>
      <div class="mc">
        <div class="score">0 – 0</div>
        <div class="badge upcoming" data-badge="${m.id}">Upcoming</div>
        <div class="cd" data-cd="${m.id}"></div>
      </div>
      <div class="team">
        ${m.awayLogo
          ? `<img class="tlogo" src="${esc(m.awayLogo)}" alt="${esc(m.away||'')}"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
             <div class="tlogo-fb">${fbEmoji}</div>`
          : `<div class="tlogo-fb" style="display:flex">${fbEmoji}</div>`
        }
        <div class="tname">${esc(m.away||'')}</div>
      </div>
    </div>
    <div class="match-meta">
      <div class="meta-left">
        <div class="meta-tag league-tag">${esc(m.league||'')}</div>
        <div class="meta-tag" id="${cardId}">--:--</div>
      </div>
    </div>`;
  }

  innerHTML += `</a>`;
  div.innerHTML = innerHTML;
  return div;
}

function renderAdminList() {
  const matches = getMatches();
  const list = document.getElementById('ap-match-list');
  if (!matches.length) { list.innerHTML = '<div class="ap-empty">No events yet. Add one above.</div>'; return; }
  list.innerHTML = '';
  matches.forEach(m => {
    const item = document.createElement('div');
    item.className = 'ap-match-item';
    const ko = new Date(m.kickoff);
    const timeStr = isNaN(ko) ? m.kickoff : ko.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const title = m.eventTitle || `${m.home||''} vs ${m.away||''}`;
    const cfg = SPORT_CONFIG[m.sport] || SPORT_CONFIG.soccer;
    item.innerHTML = `
      <div class="ap-match-info">
        <div class="ap-match-name">${cfg.icon} ${esc(title)}</div>
        <div class="ap-match-sub">${esc(m.league||'')} · ${timeStr}</div>
      </div>
      <button class="ap-remove-btn" onclick="s803RemoveMatch('${esc(m.id)}')">Remove</button>
    `;
    list.appendChild(item);
  });
}

function applyAdminMode(on) {
  document.querySelectorAll('#matches-container .match-card').forEach(c => {
    c.classList.toggle('admin-mode', on);
  });
}

// ── ADD / DELETE ──
window.s803AddMatch = function() {
  const cfg = SPORT_CONFIG[_currentSport] || SPORT_CONFIG.soccer;
  const isSolo = cfg.layout === 'solo';
  const league = document.getElementById('ap-league').value.trim();
  const kickoffRaw = document.getElementById('ap-kickoff').value;
  const post = document.getElementById('ap-post').value.trim();
  const stream = document.getElementById('ap-stream').value.trim();
  if (!kickoffRaw) { toast('⚠️ Set a start time'); return; }
  const kickoff = new Date(kickoffRaw).toISOString();
  const id = 's803_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  let newMatch;
  if (isSolo) {
    const eventTitle = document.getElementById('ap-event-title').value.trim();
    const eventSubtitle = document.getElementById('ap-event-subtitle').value.trim();
    const eventIcon = document.getElementById('ap-event-icon').value.trim();
    if (!eventTitle) { toast('⚠️ Enter event title'); return; }
    newMatch = { id, sport: _currentSport, eventTitle, eventSubtitle, eventIcon, league: league || cfg.labelLeague, kickoff, post, stream };
  } else {
    const home = document.getElementById('ap-home').value.trim();
    const away = document.getElementById('ap-away').value.trim();
    const homeLogo = document.getElementById('ap-home-logo').value.trim();
    const awayLogo = document.getElementById('ap-away-logo').value.trim();
    if (!home || !away) { toast('⚠️ Enter both team / player names'); return; }
    newMatch = { id, sport: _currentSport, home, away, homeLogo, awayLogo, league: league || cfg.labelLeague, kickoff, post, stream };
  }
  const matches = getMatches();
  matches.push(newMatch);
  saveMatches(matches);
  const container = document.getElementById('matches-container');
  const card = buildCard(newMatch);
  if (adminUnlocked) card.classList.add('admin-mode');
  container.appendChild(card);
  moUpdateLocalTimes();
  moTickCountdown();
  renderAdminList();
  ['ap-home','ap-away','ap-home-logo','ap-away-logo','ap-league','ap-post','ap-stream',
   'ap-event-title','ap-event-subtitle','ap-event-icon'].forEach(fid => {
    const el = document.getElementById(fid); if (el) el.value = '';
  });
  document.getElementById('ap-kickoff').value = '';
  ['home','away'].forEach(s => {
    document.getElementById(s+'-logo-preview').classList.remove('visible');
    document.getElementById(s+'-logo-results').classList.remove('visible');
  });
  document.getElementById('series-logo-results').classList.remove('visible');
  toast('✅ Event card added!');
};

window.s803DeleteCard = function(id) {
  if (!adminUnlocked) return;
  let matches = getMatches().filter(m => m.id !== id);
  saveMatches(matches);
  const card = document.querySelector(`.match-card[data-id="${id}"]`);
  if (card) {
    card.style.transition = 'opacity .2s,transform .2s';
    card.style.opacity = '0';
    card.style.transform = 'scale(.96)';
    setTimeout(() => card.remove(), 200);
  }
  renderAdminList();
  toast('Event removed');
};

window.s803RemoveMatch = function(id) { s803DeleteCard(id); };

// ── HTML PARSER ──
window.s803ParseHTML = function() {
  const raw = document.getElementById('ap-html-input').value.trim();
  if (!raw) { toast('⚠️ Paste some HTML first'); return; }
  const tmp = document.createElement('div');
  tmp.innerHTML = raw;
  const card = tmp.querySelector('.match-card') || tmp;
  const kickoff = card.getAttribute('data-kickoff') || '';
  const stream = card.getAttribute('data-stream') || '';
  const anchor = card.querySelector('a[href]');
  const post = anchor ? (anchor.getAttribute('href') || '') : '';
  const teams = card.querySelectorAll('.team');
  let home='',away='',homeLogo='',awayLogo='';
  if (teams.length >= 2) {
    home = (teams[0].querySelector('.tname')||{}).textContent?.trim()||'';
    away = (teams[1].querySelector('.tname')||{}).textContent?.trim()||'';
    homeLogo = teams[0].querySelector('.tlogo,img')?.getAttribute('src')||'';
    awayLogo = teams[1].querySelector('.tlogo,img')?.getAttribute('src')||'';
  }
  const leagueTag = card.querySelector('.league-tag');
  const league = leagueTag ? leagueTag.textContent.trim() : '';
  if (!home && !away) { toast('❌ Could not find team names'); return; }
  _parsedMatch = { home, away, homeLogo, awayLogo, league, kickoff, post, stream, sport: _currentSport };
  const rows = document.getElementById('ap-parse-rows');
  rows.innerHTML = '';
  function makeRow(key, val, cls) {
    const r = document.createElement('div'); r.className = 'ap-parse-row';
    r.innerHTML = `<div class="ap-parse-key">${key}</div><div class="ap-parse-val ${cls||''}">${val||'<em style="color:#444">—</em>'}</div>`;
    rows.appendChild(r);
  }
  makeRow('Home', esc(home), home?'ok':'miss');
  makeRow('Away', esc(away), away?'ok':'miss');
  const lr = document.createElement('div'); lr.className = 'ap-parse-row';
  lr.innerHTML = '<div class="ap-parse-key">Logos</div>';
  const lw = document.createElement('div'); lw.className = 'ap-parse-logos';
  if (homeLogo) { const i = document.createElement('img'); i.src = homeLogo; lw.appendChild(i); }
  if (awayLogo) { const i = document.createElement('img'); i.src = awayLogo; lw.appendChild(i); }
  if (!homeLogo && !awayLogo) lw.innerHTML = '<span style="color:#444;font-size:11px;font-style:italic;">none</span>';
  lr.appendChild(lw); rows.appendChild(lr);
  makeRow('League', esc(league), league?'ok':'warn');
  makeRow('Kickoff', esc(kickoff), kickoff?'ok':'warn');
  makeRow('Post URL', esc(post).substring(0,60)+(post.length>60?'…':''), post?'ok':'miss');
  if (stream) makeRow('Stream', esc(stream).substring(0,60)+(stream.length>60?'…':''), 'ok');
  document.getElementById('ap-parse-preview').classList.add('visible');
  toast('✅ Parsed — review then confirm');
};

window.s803ClearHTMLInput = function() {
  document.getElementById('ap-html-input').value = '';
  document.getElementById('ap-parse-preview').classList.remove('visible');
  _parsedMatch = null;
};

window.s803ConfirmParsed = function() {
  if (!_parsedMatch) { toast('⚠️ Nothing parsed'); return; }
  const { home, away, homeLogo, awayLogo, league, kickoff, post, stream } = _parsedMatch;
  if (!home && !away) { toast('⚠️ Team names missing'); return; }
  const newMatch = {
    id: 's803_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    sport: _currentSport, home, away, homeLogo, awayLogo,
    league: league || '⚽ Unknown League',
    kickoff: kickoff || new Date().toISOString(), post, stream
  };
  const matches = getMatches();
  matches.push(newMatch);
  saveMatches(matches);
  const container = document.getElementById('matches-container');
  const card = buildCard(newMatch);
  if (adminUnlocked) card.classList.add('admin-mode');
  container.appendChild(card);
  moUpdateLocalTimes(); moTickCountdown(); renderAdminList();
  document.getElementById('ap-html-input').value = '';
  document.getElementById('ap-parse-preview').classList.remove('visible');
  _parsedMatch = null;
  toast('✅ Card added from HTML!');
};

// ── LOGIN ──
window.s803AdminToggle = function() {
  if (adminUnlocked) { document.getElementById('admin-panel').classList.add('open'); return; }
  document.getElementById('login-modal').classList.add('open');
  document.getElementById('lm-pin').value = '';
  document.getElementById('lm-error').textContent = '';
  setTimeout(() => document.getElementById('lm-pin').focus(), 50);
};
window.s803CheckPin = function() {
  const pin = document.getElementById('lm-pin').value;
  if (pin === ADMIN_PIN) {
    adminUnlocked = true;
    document.getElementById('login-modal').classList.remove('open');
    document.getElementById('admin-panel').classList.add('open');
    applyAdminMode(true);
    document.getElementById('admin-lock-icon').textContent = '🔓';
    document.getElementById('admin-lock-label').textContent = 'Admin';
    document.getElementById('admin-toggle-btn').classList.add('active');
    toast('Admin unlocked');
  } else {
    const inp = document.getElementById('lm-pin');
    inp.classList.add('error');
    document.getElementById('lm-error').textContent = 'Incorrect PIN. Try again.';
    inp.value = '';
    setTimeout(() => inp.classList.remove('error'), 400);
  }
};
window.s803CancelLogin = function() { document.getElementById('login-modal').classList.remove('open'); };
window.s803CloseAdmin = function() { document.getElementById('admin-panel').classList.remove('open'); };

// ── TIME / COUNTDOWN ──
function moUpdateLocalTimes() {
  document.querySelectorAll('.s803-matches-only .meta-tag[id^="kt-"]').forEach(el => {
    try {
      const card = el.closest('.match-card');
      const ko = new Date(card.getAttribute('data-kickoff'));
      const h = ko.getHours(), min = ko.getMinutes(), ap = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 || 12;
      el.textContent = `${h12}:${min < 10 ? '0'+min : min} ${ap}`;
    } catch(e) {}
  });
}

function moTickCountdown() {
  document.querySelectorAll('.s803-matches-only .match-card[data-kickoff]').forEach(c => {
    const diff = new Date(c.getAttribute('data-kickoff')) - Date.now();
    const id = c.getAttribute('data-id');
    const cd = c.querySelector(`[data-cd="${id}"]`) || c.querySelector('.cd');
    const bd = c.querySelector(`[data-badge="${id}"]`) || c.querySelector('.badge');
    if (!cd) return;
    if (diff > 0) {
      const h = Math.floor(diff/3600000), m = Math.floor(diff%3600000/60000), s = Math.floor(diff%60000/1000);
      cd.textContent = h > 0 ? `In ${h}h ${m}m` : (m > 0 ? `In ${m}m ${s}s` : 'Starting!');
      if (bd) { bd.textContent = 'Upcoming'; bd.className = 'badge upcoming'; }
      c.classList.remove('is-live');
    } else if (diff > -10800000) {
      cd.textContent = '';
      if (bd) { bd.textContent = '🔴 LIVE'; bd.className = 'badge live'; }
      c.classList.add('is-live');
    } else {
      cd.textContent = '';
      if (bd) { bd.textContent = 'Ended'; bd.className = 'badge ended'; }
      c.classList.remove('is-live');
    }
  });
}

function toast(msg) {
  const t = document.getElementById('s803-toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 2500);
}
function esc(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── INIT ──
document.addEventListener('DOMContentLoaded', () => {
  renderAll();
  moUpdateLocalTimes();
  moTickCountdown();
  setInterval(moTickCountdown, 1000);
});

})();
